name: skill-evals

# Opt-in by PR comment so we don't burn API tokens on PRs that don't touch the
# skill. Comment `@evals` (anywhere in the body) on a PR to fire this workflow
# against that PR's HEAD commit.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  evals:
    # Trusted commenters only. `issue_comment` checks out the PR's head SHA
    # and runs that code with LANGWATCH_VIRTUAL_AI_KEY in the environment,
    # so a drive-by PR could otherwise swap the script and exfiltrate the
    # gateway key. Maintainers can fire @evals; anyone else's comment is
    # silently ignored.
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@evals') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: react to comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: resolve PR ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api "/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
          echo "sha=$(echo "$PR_JSON" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
          echo "ref=$(echo "$PR_JSON" | jq -r .head.ref)" >> "$GITHUB_OUTPUT"

      # Third-party Actions pinned by commit SHA - tag refs can be moved by
      # the publisher (the actions/checkout v4 tag itself updates whenever a
      # v4.x.y is cut), and this workflow runs with privileged secrets.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24+ runs .ts natively via --experimental-strip-types without
          # extra deps. CI runner pins the same minimum the local script does.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: run evals
        id: run
        env:
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          LANGWATCH_PROJECT_ID: ${{ secrets.LANGWATCH_PROJECT_ID }}
          LANGWATCH_VIRTUAL_AI_KEY: ${{ secrets.LANGWATCH_VIRTUAL_AI_KEY }}
          GITHUB_SHA: ${{ steps.pr.outputs.sha }}
          GITHUB_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -o pipefail
          pnpm run evals 2>&1 | tee /tmp/evals.log

      - name: comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Skill evals · \`${{ steps.pr.outputs.sha }}\`"
            echo ""
            if [ "${{ steps.run.outcome }}" = "success" ]; then
              echo "Run completed. Inspect this commit vs main in [LangWatch](https://app.langwatch.ai)."
            else
              echo "Run failed - see workflow logs for details."
            fi
            echo ""
            echo "<details><summary>Output</summary>"
            echo ""
            echo '```'
            tail -120 /tmp/evals.log || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
          } | gh pr comment "${{ github.event.issue.number }}" --body-file -
