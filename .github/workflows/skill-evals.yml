name: skill-evals

# Two ways to trigger:
#  1. `@evals` in a PR comment (from a maintainer) - runs against the PR's
#     head SHA and posts the result back as a comment.
#  2. Manual dispatch from the Actions tab - runs against an arbitrary
#     ref. No PR to post back to, so the result is in the job log + the
#     LangWatch dashboard.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to run the evals against."
        required: false
        default: "main"

permissions:
  contents: read
  pull-requests: write

jobs:
  evals:
    # Accept either trigger. For issue_comment, gate on author_association
    # because the job checks out the PR's head SHA and runs that code with
    # LANGWATCH_VIRTUAL_AI_KEY in env - a drive-by PR could otherwise swap
    # the script and exfiltrate the gateway key. workflow_dispatch is
    # already restricted to users with write access to the repo, so no
    # extra gate is needed there.
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@evals') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: react to comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: resolve ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_JSON=$(gh api "/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
            echo "sha=$(echo "$PR_JSON" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch - resolve the user-supplied ref (branch/tag/SHA) to a SHA.
            SHA=$(gh api "/repos/${{ github.repository }}/commits/${{ inputs.ref }}" --jq .sha)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi

      # Third-party Actions pinned by commit SHA - tag refs can be moved by
      # the publisher (the actions/checkout v4 tag itself updates whenever a
      # v4.x.y is cut), and this workflow runs with privileged secrets.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Node 24+ runs .ts natively via --experimental-strip-types without
          # extra deps. CI runner pins the same minimum the local script does.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: run evals
        id: run
        env:
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          LANGWATCH_PROJECT_ID: ${{ secrets.LANGWATCH_PROJECT_ID }}
          LANGWATCH_VIRTUAL_AI_KEY: ${{ secrets.LANGWATCH_VIRTUAL_AI_KEY }}
          GITHUB_SHA: ${{ steps.ref.outputs.sha }}
          # PR number is only available for issue_comment; left unset for dispatch.
          GITHUB_PR_NUMBER: ${{ github.event.issue.number }}
          EVALS_SUMMARY_PATH: ${{ github.workspace }}/evals-summary.json
        run: |
          set -o pipefail
          pnpm run evals 2>&1 | tee /tmp/evals.log

      - name: upsert PR comment
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          SHA: ${{ steps.ref.outputs.sha }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          SUMMARY_PATH: ${{ github.workspace }}/evals-summary.json
          # Stable HTML-comment marker; lets us find the previous comment on
          # re-runs and PATCH it in place instead of stacking up.
          MARKER: "<!-- skill-evals-marker -->"
        run: |
          # Render the comment body. Three sections: header + link, summary
          # table (when the run produced a summary), and the truncated log.
          {
            echo "$MARKER"
            echo "## Skill evals · \`$SHA\`"
            echo ""
            if [ "$RUN_OUTCOME" = "success" ] && [ -f "$SUMMARY_PATH" ]; then
              SLUG=$(jq -r .experiment_slug "$SUMMARY_PATH")
              RUN_ID=$(jq -r .run_id "$SUMMARY_PATH")
              PASSES=$(jq -r .totals.passes "$SUMMARY_PATH")
              FAILS=$(jq -r .totals.fails "$SUMMARY_PATH")
              SCORERS=$(jq -r .totals.scorers "$SUMMARY_PATH")
              echo "**${PASSES} / ${SCORERS}** scorers passed. [Open run in LangWatch](https://app.langwatch.ai/experiments/${SLUG}?runId=${RUN_ID})"
              echo ""
              echo "| target | pass | fail | rate | avg latency | total tokens |"
              echo "|---|---:|---:|---:|---:|---:|"
              jq -r '
                .targets
                | to_entries
                | sort_by(.key)
                | .[]
                | "| `\(.key)` | \(.value.passes) | \(.value.fails) | \((.value.pass_rate * 100 | floor))% | \(.value.agent_avg_duration_ms) ms | \(.value.agent_total_tokens) |"
              ' "$SUMMARY_PATH"
            elif [ "$RUN_OUTCOME" = "success" ]; then
              echo "Run completed but summary file missing - see workflow logs."
            else
              echo "Run failed - see workflow logs for details."
            fi
            echo ""
            echo "<details><summary>Full log</summary>"
            echo ""
            echo '```'
            tail -120 /tmp/evals.log || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "_updated $(date -u +'%Y-%m-%d %H:%M UTC')_"
          } > /tmp/comment-body.md

          # Find the existing comment with our marker. List up to 100 (a PR
          # typically has far fewer); paginate if you ever hit that ceiling.
          EXISTING_ID=$(gh api "/repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | .[0].id // empty")

          if [ -n "$EXISTING_ID" ]; then
            echo "patching existing comment $EXISTING_ID"
            gh api -X PATCH "/repos/$REPO/issues/comments/$EXISTING_ID" \
              -F body=@/tmp/comment-body.md > /dev/null
          else
            echo "creating new comment"
            gh pr comment "$PR" --body-file /tmp/comment-body.md > /dev/null
          fi
